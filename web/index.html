<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Graph</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-view="landing">
    <!-- One header serves both states. On "landing" it is the entire screen;
         on "graph" it collapses to a bar above the canvas. Same DOM, so there
         is no second search field to keep in sync. -->
    <header id="topbar">
      <div id="brand">
        <img id="brand-mark" src="/logo.svg" alt="" width="84" height="84" />
        <span id="brand-name">word graph</span>
      </div>

      <form id="search-form" role="search" autocomplete="off">
        <input
          id="word-input"
          name="word"
          type="text"
          placeholder="Type a word…"
          aria-label="Word to explore"
          enterkeyhint="search"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
        />
        <button id="word-input-clear" type="button" aria-label="Clear and start again" hidden>×</button>
      </form>

      <div id="view-controls">
        <label for="distance-max">Within</label>
        <input
          id="distance-max"
          type="range"
          min="0"
          max="8"
          value="5"
          step="1"
          aria-label="Maximum changes away"
        />
        <span id="distance-value"></span>

        <!-- Rings or force-directed. A display preference, so it stays quiet
             next to the action beside it. See layoutOptionsFor() in main.js. -->
        <div id="layout-control" role="group" aria-label="Layout">
          <button type="button" class="layout-option" data-layout="rings" aria-pressed="true">Rings</button>
          <button type="button" class="layout-option" data-layout="compact" aria-pressed="false">Compact</button>
        </div>
      </div>

      <!-- The word the pointer is over. It comes and goes, so it is its own
           element rather than the brand. -->
      <p id="pointed" hidden>
        <span id="hover-word"></span>
        <span id="hover-meta"></span>
      </p>

      <p id="status"></p>
    </header>

    <div id="layout">
      <aside id="path-panel" hidden>
        <ol id="path-list"></ol>
      </aside>
      <main id="graph-container">
        <div id="legend" hidden></div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
