<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Graph</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="controls">
      <div id="title-pane">
        <span id="hover-word">Word Graph</span>
        <span id="hover-meta"></span>
      </div>
      <label class="slider-field">
        Word length: <span id="length-value"></span>
        <input id="length-slider" type="range" min="1" max="23" value="5" step="1" />
      </label>
      <label>
        Word
        <input id="word-input" list="word-options" autocomplete="off" placeholder="e.g. cat" />
        <datalist id="word-options"></datalist>
      </label>
      <label class="slider-field">
        Distance: <span id="distance-value"></span>
        <span class="dual-range">
          <input id="distance-min" type="range" min="0" max="8" value="0" step="1" />
          <input id="distance-max" type="range" min="0" max="8" value="2" step="1" />
        </span>
      </label>
      <button id="explore-button">Explore</button>
      <button id="full-graph-button">Show full graph</button>
      <span id="status"></span>
    </header>
    <div id="layout">
      <aside id="path-panel" hidden>
        <h2>Path</h2>
        <ol id="path-list"></ol>
      </aside>
      <main id="graph-container">
        <div id="legend" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
